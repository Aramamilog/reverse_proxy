listen:
  host: "127.0.0.1"
  port: 8000

upstreams:
  - host: "127.0.0.1"
    port: 9001
    pool_size: 50
    concurrency_limit: 50

  - host: "127.0.0.1"
    port: 9002
    pool_size: 50
    concurrency_limit: 50

  - host: "127.0.0.1"
    port: 9003
    pool_size: 50
    concurrency_limit: 50

  - host: "127.0.0.1"
    port: 9004
    pool_size: 50
    concurrency_limit: 50

timeouts:
  connect_ms: 1000
  read_ms: 15000
  write_ms: 15000
  total_ms: 30000

limits:
  max_client_conns: 200 # Это общий лимит клиентских TCP-соединений.
  max_conns_per_upstream: 100

logging:
  level: "info"

# Best stable local benchmark:
# k6 run --vus 200 --duration 10s tests/test.js
# ~12.2k RPS, 0% errors, p95 ~31ms
